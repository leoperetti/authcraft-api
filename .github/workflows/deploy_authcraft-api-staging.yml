name: Deploy reviewed AuthCraft Staging release

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful package/evaluation run to resume without rebuilding
        type: string
        required: true
      review_issue_number:
        description: Open GitHub issue containing the authenticated review for this exact release
        type: string
        required: true
      staging_baseline_sha:
        description: Last verified Staging deployment commit, or unknown for a reviewed initial bootstrap
        type: string
        required: true
        default: unknown
      allow_initial_staging_bootstrap:
        description: Confirm this is the one-time initial Staging release with an unknown baseline
        type: boolean
        required: true
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: authcraft-staging-deployment
  cancel-in-progress: false

jobs:
  resolve-release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - name: Verify the original successful Staging release and retained evidence
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_RUN_ID -notmatch '^[1-9][0-9]*$') {
            throw 'A valid original Staging release run ID is required.'
          }
          $workflowRun = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:RELEASE_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or
              $workflowRun.id -cne [long]$env:RELEASE_RUN_ID -or
              $workflowRun.repository.full_name -cne $env:GITHUB_REPOSITORY -or
              $workflowRun.head_repository.full_name -cne $env:GITHUB_REPOSITORY -or
              $workflowRun.head_branch -cne 'main' -or
              $workflowRun.event -cne 'workflow_dispatch' -or
              $workflowRun.path -cne '.github/workflows/main_authcraft-api-staging.yml' -or
              $workflowRun.status -cne 'completed' -or
              $workflowRun.conclusion -cne 'success' -or
              $workflowRun.head_sha -notmatch '^[a-f0-9]{40}$') {
            throw 'The selected run is not a successful Staging package/evaluation run from main.'
          }
          $jobs = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:RELEASE_RUN_ID/jobs?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $jobs.total_count -ne @($jobs.jobs).Count) {
            throw 'The original Staging run job history is incomplete.'
          }
          foreach ($requiredJob in @('validate', 'verify-staging-publisher', 'preflight-staging')) {
            $matchingJobs = @($jobs.jobs | Where-Object { $_.name -ceq $requiredJob })
            if ($matchingJobs.Count -ne 1 -or
                $matchingJobs[0].status -cne 'completed' -or
                $matchingJobs[0].conclusion -cne 'success') {
              throw "The original Staging release did not pass $requiredJob."
            }
          }
          $artifactResponse = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:RELEASE_RUN_ID/artifacts?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or
              $artifactResponse.total_count -ne @($artifactResponse.artifacts).Count) {
            throw 'The original Staging release artifact inventory is incomplete.'
          }
          foreach ($artifactName in @('api', 'dacpac', 'release-manifest', 'staging-schema-review')) {
            $matchingArtifacts = @($artifactResponse.artifacts | Where-Object { $_.name -ceq $artifactName })
            if ($matchingArtifacts.Count -ne 1 -or
                $matchingArtifacts[0].expired -ne $false -or
                [DateTimeOffset]::Parse($matchingArtifacts[0].expires_at) -le [DateTimeOffset]::UtcNow -or
                [string]$matchingArtifacts[0].workflow_run.id -cne $env:RELEASE_RUN_ID -or
                $matchingArtifacts[0].workflow_run.head_sha -cne $workflowRun.head_sha) {
              throw "The original Staging release artifact $artifactName is missing, expired, duplicated, or mismatched."
            }
          }
          "release_sha=$($workflowRun.head_sha)" | Add-Content -Path $env:GITHUB_OUTPUT

  deploy-reviewed-release:
    if: github.ref == 'refs/heads/main'
    needs: resolve-release
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Record deployment start time
        id: attempt-start
        shell: pwsh
        run: |
          "started_at=$([DateTimeOffset]::UtcNow.ToString('o'))" | Add-Content -Path $env:GITHUB_OUTPUT

      - name: Require synthetic Staging smoke credentials before remote changes
        id: credentials
        shell: pwsh
        env:
          AUTHCRAFT_STAGING_SMOKE_IDENTIFIER: ${{ secrets.AUTHCRAFT_STAGING_SMOKE_IDENTIFIER }}
          AUTHCRAFT_STAGING_SMOKE_PASSWORD: ${{ secrets.AUTHCRAFT_STAGING_SMOKE_PASSWORD }}
          AUTHCRAFT_STAGING_SMOKE_CLIENT_ID: ${{ secrets.AUTHCRAFT_STAGING_SMOKE_CLIENT_ID }}
          AUTHCRAFT_STAGING_SMOKE_TENANT_CLIENT_ID: ${{ secrets.AUTHCRAFT_STAGING_SMOKE_TENANT_CLIENT_ID }}
        run: |
          $requiredSecrets = @(
            'AUTHCRAFT_STAGING_SMOKE_IDENTIFIER',
            'AUTHCRAFT_STAGING_SMOKE_PASSWORD',
            'AUTHCRAFT_STAGING_SMOKE_CLIENT_ID',
            'AUTHCRAFT_STAGING_SMOKE_TENANT_CLIENT_ID'
          )
          foreach ($secretName in $requiredSecrets) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($secretName))) {
              throw "Required synthetic Staging smoke secret $secretName is not configured."
            }
          }
          if ($env:AUTHCRAFT_STAGING_SMOKE_CLIENT_ID -cne $env:AUTHCRAFT_STAGING_SMOKE_TENANT_CLIENT_ID) {
            throw 'Synthetic Staging smoke client and tenant identifiers must match.'
          }

      - name: Check out trusted deployment scripts
        uses: actions/checkout@v4

      - name: Check out the exact candidate source for provenance validation
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.release_sha }}
          path: candidate-source

      - name: Set up .NET for isolated transaction verification
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Verify transaction coverage using this runner's deployment tool
        id: transaction-verification
        timeout-minutes: 15
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.SQL.SSDT -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($installation)) {
            throw 'An SSDT-enabled Visual Studio installation is required.'
          }
          $env:SQLPACKAGE_PATH = Join-Path $installation 'Common7\IDE\Extensions\Microsoft\SQLDB\DAC\SqlPackage.exe'
          if (-not (Test-Path -LiteralPath $env:SQLPACKAGE_PATH -PathType Leaf)) {
            throw 'The deployment SqlPackage executable is unavailable.'
          }
          & SqlLocalDB.exe start MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) { throw 'Isolated LocalDB transaction verification is unavailable.' }
          $env:AUTHCRAFT_LOCAL_ENVIRONMENT_SQL_CONNECTION = 'Server=(localdb)\MSSQLLocalDB;Database=authcraft_development;Integrated Security=True;TrustServerCertificate=True'
          $env:AUTHCRAFT_TRANSACTION_EVIDENCE_DIRECTORY = Join-Path $env:RUNNER_TEMP 'staging-deployment-evidence'
          dotnet test .\authcraft-api.Tests\authcraft-api.Tests.csproj --configuration Release `
            --filter 'FullyQualifiedName=authcraft_api.Tests.LocalEnvironmentSqlTests.TransactionalPublishDocumentsSeparateSchemaAndPostdeploymentCoverage' `
            --logger 'trx;LogFileName=transaction-tests.trx' --results-directory $env:AUTHCRAFT_TRANSACTION_EVIDENCE_DIRECTORY
          if ($LASTEXITCODE -ne 0) { throw 'Transaction phase verification failed; no remote publication is allowed.' }
          Import-Module .\scripts\DeploymentReview.psm1 -Force
          $proofPath = Join-Path $env:AUTHCRAFT_TRANSACTION_EVIDENCE_DIRECTORY 'transaction-verification.json'
          $null = Get-DeploymentTransactionVerification -Path $proofPath -SqlPackagePath $env:SQLPACKAGE_PATH
          "sqlpackage_path=$env:SQLPACKAGE_PATH" | Add-Content -Path $env:GITHUB_OUTPUT

      - name: Download the exact original Staging release artifacts
        uses: actions/download-artifact@v4
        with:
          name: api
          path: ${{ runner.temp }}/staging-release/api
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Download the exact original Staging DACPAC
        uses: actions/download-artifact@v4
        with:
          name: dacpac
          path: ${{ runner.temp }}/staging-release/dacpac
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Download the exact original release manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: ${{ runner.temp }}/staging-release/manifest
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Download the exact reviewed SQL evaluation evidence
        uses: actions/download-artifact@v4
        with:
          name: staging-schema-review
          path: ${{ runner.temp }}/staging-release/schema-review
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Log in to the Staging publisher through OIDC
        uses: azure/login@v2
        with:
          client-id: a2382f63-d653-47f3-82ca-9f2696f63f0a
          tenant-id: b7bd0c07-88dc-4c47-81ba-608fd7607a82
          subscription-id: 948a8f49-fd90-40d9-8fa9-12f722768a7a

      - name: Verify release provenance and current Staging gates
        id: preflight
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_COMMIT_SHA: ${{ needs.resolve-release.outputs.release_sha }}
          STAGING_BASELINE_SHA: ${{ inputs.staging_baseline_sha }}
          ALLOW_INITIAL_STAGING_BOOTSTRAP: ${{ inputs.allow_initial_staging_bootstrap }}
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactDirectory = Join-Path $env:RUNNER_TEMP 'staging-release'
          $apiPath = Join-Path $artifactDirectory 'api\api.zip'
          $dacpacPath = Join-Path $artifactDirectory 'dacpac\authcraft-db.dacpac'
          $manifestPath = Join-Path $artifactDirectory 'manifest\release-manifest.json'
          $schemaReviewPath = Join-Path $artifactDirectory 'schema-review'
          if (@(Get-ChildItem -LiteralPath $schemaReviewPath -File -Filter '*-report.xml').Count -ne 1 -or
              @(Get-ChildItem -LiteralPath $schemaReviewPath -File -Filter '*-script.sql').Count -ne 1) {
            throw 'The original reviewed SQL report and script are missing or ambiguous.'
          }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.commit_sha -cne $env:RELEASE_COMMIT_SHA -or
              [string]$manifest.run_id -cne $env:RELEASE_RUN_ID) {
            throw 'The original release manifest does not match the selected Staging run.'
          }
          $preflightParameters = @{
            ManifestPath = $manifestPath
            ApiArtifactPath = $apiPath
            DatabaseArtifactPath = $dacpacPath
            ExpectedCommitSha = $env:RELEASE_COMMIT_SHA
            ExpectedRunId = $env:RELEASE_RUN_ID
            GitHubRef = 'refs/heads/main'
            TargetEnvironment = 'staging'
            RepositoryPath = (Resolve-Path '.\candidate-source').Path
          }
          if ($env:ALLOW_INITIAL_STAGING_BOOTSTRAP -eq 'true') {
            if ($env:STAGING_BASELINE_SHA -cne 'unknown') {
              throw 'Initial Staging bootstrap requires an unknown baseline.'
            }
            $preflightParameters.LastSuccessfulCommitSha = 'unknown'
            $preflightParameters.AllowInitialStagingBootstrap = $true
          } else {
            $preflightParameters.LastSuccessfulCommitSha = $env:STAGING_BASELINE_SHA
          }
          $preflightOutput = & .\scripts\Test-ReleasePreflight.ps1 @preflightParameters
          if ($LASTEXITCODE -ne 0) { throw 'Staging preflight failed. No deployment was attempted.' }
          $preflight = ($preflightOutput -join "`n") | ConvertFrom-Json
          if ($preflight.state -cne 'ready_for_review' -or
              $preflight.target -cne 'staging' -or
              $preflight.commit_sha -cne $env:RELEASE_COMMIT_SHA -or
              [string]$preflight.run_id -cne $env:RELEASE_RUN_ID -or
              $preflight.deployment_authorized -ne $false) {
            throw 'Staging preflight did not return the expected review-only state.'
          }
          $preflightOutput | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Log in to the Staging permission manager
        uses: azure/login@v2
        with:
          client-id: c376b9f5-2b0b-406f-8579-ef8787001115
          tenant-id: b7bd0c07-88dc-4c47-81ba-608fd7607a82
          subscription-id: 948a8f49-fd90-40d9-8fa9-12f722768a7a

      - name: Grant the temporary Staging publisher role
        id: permission-grant
        shell: powershell
        run: |
          & .\scripts\Set-StagingPublisherRole.ps1 -Mode Grant |
            Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Restore the Staging publisher session before SQL
        uses: azure/login@v2
        with:
          client-id: a2382f63-d653-47f3-82ca-9f2696f63f0a
          tenant-id: b7bd0c07-88dc-4c47-81ba-608fd7607a82
          subscription-id: 948a8f49-fd90-40d9-8fa9-12f722768a7a

      - name: Publish the reviewed Staging database plan
        id: database
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_COMMIT_SHA: ${{ needs.resolve-release.outputs.release_sha }}
          REVIEW_ISSUE_NUMBER: ${{ inputs.review_issue_number }}
          STAGING_BASELINE_SHA: ${{ inputs.staging_baseline_sha }}
          SQLPACKAGE_PATH: ${{ steps.transaction-verification.outputs.sqlpackage_path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $account = az account show --output json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or
              $account.id -cne '948a8f49-fd90-40d9-8fa9-12f722768a7a' -or
              $account.tenantId -cne 'b7bd0c07-88dc-4c47-81ba-608fd7607a82' -or
              $account.user.type -cne 'servicePrincipal' -or
              $account.user.name -cne 'a2382f63-d653-47f3-82ca-9f2696f63f0a') {
            throw 'Azure login is not the expected Staging publisher identity.'
          }
          $accessToken = az account get-access-token --resource https://database.windows.net/ --query accessToken --output tsv
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($accessToken)) {
            throw 'A Staging SQL access token could not be acquired.'
          }
          Write-Output "::add-mask::$accessToken"
          $env:AUTHCRAFT_SQL_ACCESS_TOKEN = $accessToken
          try {
            $publishOutput = & .\scripts\Invoke-DatabaseDeployment.ps1 `
              -Mode Publish `
              -TargetEnvironment staging `
              -DacpacPath (Join-Path $env:RUNNER_TEMP 'staging-release\dacpac\authcraft-db.dacpac') `
              -ManifestPath (Join-Path $env:RUNNER_TEMP 'staging-release\manifest\release-manifest.json') `
              -ExpectedCommitSha $env:RELEASE_COMMIT_SHA `
              -ExpectedRunId $env:RELEASE_RUN_ID `
              -ReviewIssueNumber $env:REVIEW_ISSUE_NUMBER `
              -StagingBaselineSha $env:STAGING_BASELINE_SHA `
              -SqlPackagePath $env:SQLPACKAGE_PATH `
              -TransactionVerificationPath (Join-Path $env:RUNNER_TEMP 'staging-deployment-evidence\transaction-verification.json') `
              -AttemptPath (Join-Path $env:RUNNER_TEMP 'staging-deployment-evidence\sql-attempt.json')
            if ($LASTEXITCODE -ne 0) { throw 'The reviewed Staging database deployment failed.' }
            $publishResult = ($publishOutput -join "`n") | ConvertFrom-Json
            if ($publishResult.state -cne 'published' -or
                $publishResult.target_environment -cne 'staging' -or
                $publishResult.commit_sha -cne $env:RELEASE_COMMIT_SHA -or
                [string]$publishResult.run_id -cne $env:RELEASE_RUN_ID) {
              throw 'The database publisher did not confirm the exact reviewed Staging release.'
            }
            $publishOutput | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }
          finally {
            $env:AUTHCRAFT_SQL_ACCESS_TOKEN = $null
            $accessToken = $null
          }

      - name: Restore the permission manager for mandatory cleanup
        if: always() && steps.permission-grant.outcome != 'skipped' && steps.permission-grant.outcome != ''
        id: permission-cleanup-login
        uses: azure/login@v2
        with:
          client-id: c376b9f5-2b0b-406f-8579-ef8787001115
          tenant-id: b7bd0c07-88dc-4c47-81ba-608fd7607a82
          subscription-id: 948a8f49-fd90-40d9-8fa9-12f722768a7a

      - name: Revoke and independently verify the Staging publisher role
        if: always() && steps.permission-cleanup-login.outcome == 'success'
        id: permission-revoke
        shell: powershell
        run: |
          & .\scripts\Set-StagingPublisherRole.ps1 -Mode Revoke |
            Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Require verified revocation before application deployment
        if: always() && steps.permission-grant.outcome != 'skipped' && steps.permission-grant.outcome != ''
        shell: pwsh
        env:
          REVOCATION_RESULT: ${{ steps.permission-revoke.outcome }}
        run: |
          if ($env:REVOCATION_RESULT -cne 'success') {
            throw 'CRITICAL: Staging publisher revocation is unverified. Stop deployment and revoke the role through the recovery operator.'
          }

      - name: Restore the Staging application publisher session
        if: success() && steps.database.outcome == 'success' && steps.permission-revoke.outcome == 'success'
        uses: azure/login@v2
        with:
          client-id: a2382f63-d653-47f3-82ca-9f2696f63f0a
          tenant-id: b7bd0c07-88dc-4c47-81ba-608fd7607a82
          subscription-id: 948a8f49-fd90-40d9-8fa9-12f722768a7a

      - name: Deploy the same API package to Staging
        if: success() && steps.database.outcome == 'success' && steps.permission-revoke.outcome == 'success'
        id: application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $apiPackage = Join-Path $env:RUNNER_TEMP 'staging-release\api\api.zip'
          az webapp deploy --resource-group AuthCraft --name authcraft-api-staging --src-path $apiPackage --type zip --async false
          if ($LASTEXITCODE -ne 0) { throw 'Staging API package deployment failed after the database step; inspect Staging before retrying.' }

      - name: Verify Staging health, synthetic login, and tenant roles
        id: smoke
        shell: pwsh
        env:
          AUTHCRAFT_STAGING_SMOKE_IDENTIFIER: ${{ secrets.AUTHCRAFT_STAGING_SMOKE_IDENTIFIER }}
          AUTHCRAFT_STAGING_SMOKE_PASSWORD: ${{ secrets.AUTHCRAFT_STAGING_SMOKE_PASSWORD }}
          AUTHCRAFT_STAGING_SMOKE_CLIENT_ID: ${{ secrets.AUTHCRAFT_STAGING_SMOKE_CLIENT_ID }}
          AUTHCRAFT_STAGING_SMOKE_TENANT_CLIENT_ID: ${{ secrets.AUTHCRAFT_STAGING_SMOKE_TENANT_CLIENT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\Test-StagingRelease.ps1 -ExpectedVersion '${{ needs.resolve-release.outputs.release_sha }}'
          if ($LASTEXITCODE -ne 0) { throw 'Staging release smoke verification failed.' }

      - name: Record Staging deployment attempt
        if: always()
        shell: pwsh
        env:
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_COMMIT_SHA: ${{ needs.resolve-release.outputs.release_sha }}
          TRANSACTION_RESULT: ${{ steps.transaction-verification.outcome }}
          PREFLIGHT_RESULT: ${{ steps.preflight.outcome }}
          DATABASE_RESULT: ${{ steps.database.outcome }}
          PERMISSION_GRANT_RESULT: ${{ steps.permission-grant.outcome }}
          PERMISSION_REVOKE_RESULT: ${{ steps.permission-revoke.outcome }}
          APPLICATION_RESULT: ${{ steps.application.outcome }}
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
          STARTED_AT: ${{ steps.attempt-start.outputs.started_at }}
        run: |
          $ErrorActionPreference = 'Stop'
          $evidenceDirectory = Join-Path $env:RUNNER_TEMP 'staging-deployment-evidence'
          New-Item -ItemType Directory -Path $evidenceDirectory -Force | Out-Null
          $sqlAttemptPath = Join-Path $evidenceDirectory 'sql-attempt.json'
          if (Test-Path -LiteralPath $sqlAttemptPath -PathType Leaf) {
            $sqlAttempt = Get-Content -LiteralPath $sqlAttemptPath -Raw -Encoding UTF8 | ConvertFrom-Json
            $attempt = @{}
            foreach ($property in $sqlAttempt.PSObject.Properties) {
              $attempt[$property.Name] = $property.Value
            }
          } else {
            $attempt = @{
              schema_version = 1
              release_run_id = $env:RELEASE_RUN_ID
              commit_sha = $env:RELEASE_COMMIT_SHA
              target_environment = 'staging'
              started_at = $env:STARTED_AT
              result = 'blocked'
              schema_result = 'not_executed'
              include_transactional_scripts = $null
              postdeploy_transaction = $null
              transaction_scope = 'unverified'
              transaction_verification_reference = $null
              postdeploy_result = 'pending'
              failure_state_verification = 'pending'
              failure_stage = 'preflight'
              sanitized_failure_summary = 'La publicacion se bloqueo antes de obtener evidencia SQL.'
              recommended_next_step = 'Revisar los gates y conservar la evidencia antes de reintentar.'
            }
            if ($env:DATABASE_RESULT -in @('failure', 'cancelled')) {
              $attempt.schema_result = 'unknown'
              $attempt.postdeploy_result = 'unknown'
              $attempt.failure_state_verification = 'unknown'
              $attempt.result = 'failed'
            }
          }
          function Get-StageResult([string]$Outcome) {
            switch ($Outcome) {
              'success' { 'succeeded' }
              'failure' { 'failed' }
              'cancelled' { 'unknown' }
              { $_ -in @('', 'skipped') } { 'not_executed' }
              default { throw 'Unexpected workflow stage outcome.' }
            }
          }
          $attempt.deployment_run_id = $env:GITHUB_RUN_ID
          $attempt.finished_at = [DateTimeOffset]::UtcNow.ToString('o')
          $attempt.transaction_test_result = Get-StageResult $env:TRANSACTION_RESULT
          $attempt.preflight_result = Get-StageResult $env:PREFLIGHT_RESULT
          $attempt.permission_grant_result = Get-StageResult $env:PERMISSION_GRANT_RESULT
          $attempt.permission_revoke_result = Get-StageResult $env:PERMISSION_REVOKE_RESULT
          $attempt.application_result = Get-StageResult $env:APPLICATION_RESULT
          $attempt.smoke_result = Get-StageResult $env:SMOKE_RESULT
          $attempt.health_result = if ($env:SMOKE_RESULT -eq 'failure') { 'unknown' } else { $attempt.smoke_result }
          $attempt.authentication_result = $attempt.health_result
          $attempt.report_artifact_reference = 'staging-deployment-attempt'
          $attempt.report_retention_days = 30
          if ($attempt.result -eq 'pending' -and $env:DATABASE_RESULT -in @('failure', 'cancelled')) {
            $attempt.result = 'failed'
            $attempt.schema_result = 'unknown'
            $attempt.postdeploy_result = 'unknown'
            $attempt.failure_state_verification = 'unknown'
          }
          $manifestPath = Join-Path $env:RUNNER_TEMP 'staging-release\manifest\release-manifest.json'
          $manifestVerified = $false
          if (Test-Path -LiteralPath $manifestPath -PathType Leaf) {
            $manifest = Get-Content -LiteralPath $manifestPath -Raw -Encoding UTF8 | ConvertFrom-Json
            $manifestVerified = $manifest.commit_sha -ceq $env:RELEASE_COMMIT_SHA -and
              [string]$manifest.run_id -ceq $env:RELEASE_RUN_ID -and
              $manifest.api.artifact -ceq 'api' -and $manifest.database.artifact -ceq 'dacpac' -and
              $manifest.api.sha256 -cmatch '^[a-f0-9]{64}$' -and
              $manifest.database.sha256 -cmatch '^[a-f0-9]{64}$'
          }
          $candidateBindingValid = $attempt.commit_sha -ceq $env:RELEASE_COMMIT_SHA -and
            [string]$attempt.release_run_id -ceq $env:RELEASE_RUN_ID
          $stagingValidated = $manifestVerified -and $candidateBindingValid -and
            $env:PERMISSION_GRANT_RESULT -eq 'success' -and $env:PERMISSION_REVOKE_RESULT -eq 'success' -and
            $env:TRANSACTION_RESULT -eq 'success' -and
            $env:PREFLIGHT_RESULT -eq 'success' -and $env:DATABASE_RESULT -eq 'success' -and
            $env:APPLICATION_RESULT -eq 'success' -and $env:SMOKE_RESULT -eq 'success' -and
            $attempt.result -eq 'succeeded' -and $attempt.target_environment -ceq 'staging' -and
            $attempt.include_transactional_scripts -eq $true -and $attempt.postdeploy_transaction -eq $true -and
            $attempt.schema_result -eq 'succeeded' -and
            $attempt.transaction_scope -eq 'separate_schema_and_postdeploy'
          if ($stagingValidated) {
            $attempt.result = 'succeeded'
            $attempt.failure_stage = $null
            $attempt.sanitized_failure_summary = $null
            $attempt.recommended_next_step = $null
          } elseif ($env:PERMISSION_GRANT_RESULT -notin @('', 'skipped') -and $env:PERMISSION_REVOKE_RESULT -ne 'success') {
            $attempt.result = 'failed'
            $attempt.failure_stage = 'permission_revocation'
            $attempt.sanitized_failure_summary = 'Revocacion del permiso temporal no verificada; detener despliegue.'
            $attempt.recommended_next_step = 'El operador debe revocar db_owner y verificar permisos desde una conexion nueva.'
          } elseif ($env:SMOKE_RESULT -eq 'success') {
            $attempt.result = 'failed'
            $attempt.failure_stage = 'evidence'
            $attempt.sanitized_failure_summary = 'Los resultados de etapas no acreditan el mismo despliegue completo.'
            $attempt.recommended_next_step = 'Inspeccionar el intento y sus gates; no promover ni reintentar automaticamente.'
          } elseif ($env:APPLICATION_RESULT -in @('failure', 'cancelled') -or $env:SMOKE_RESULT -in @('failure', 'cancelled')) {
            $attempt.result = 'failed'
            $attempt.failure_stage = if ($env:APPLICATION_RESULT -in @('failure', 'cancelled')) { 'application_publish' } else { 'smoke' }
            $attempt.sanitized_failure_summary = 'Fallo una etapa posterior a SQL; no se autoriza promocion.'
            $attempt.recommended_next_step = 'Inspeccionar la API y su compatibilidad con el esquema aplicado antes de recuperar.'
          } elseif ($attempt.result -eq 'succeeded') {
            $attempt.result = 'failed'
          }
          $attempt | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath (Join-Path $evidenceDirectory 'deployment-attempt.json') -Encoding UTF8
          $candidate = [ordered]@{
            commit_sha = $env:RELEASE_COMMIT_SHA
            run_id = $env:RELEASE_RUN_ID
            api_artifact_name = 'api'
            api_sha256 = $null
            dacpac_artifact_name = 'dacpac'
            dacpac_sha256 = $null
            state = $(if ($attempt.result -eq 'failed') { 'staging_failed' } else { 'built' })
            staging_validation_state = 'not_validated'
            staging_validation_reference = $null
            promotion_authorized = $false
          }
          if ($manifestVerified) {
            $candidate.api_sha256 = $manifest.api.sha256
            $candidate.dacpac_sha256 = $manifest.database.sha256
          }
          if ($stagingValidated) {
            $candidate.state = 'production_blocked'
            $candidate.staging_validation_state = 'staging_validated'
            $candidate.staging_validation_reference = @{
              deployment_run_id = $env:GITHUB_RUN_ID
              artifact = 'staging-deployment-attempt'
              attempt_file = 'deployment-attempt.json'
              attempt_sha256 = (Get-FileHash -LiteralPath (Join-Path $evidenceDirectory 'deployment-attempt.json') -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          $candidate | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $evidenceDirectory 'candidate-release.json') -Encoding UTF8
          "Candidate state=$($candidate.state); staging_validation=$($candidate.staging_validation_state); promotion_authorized=false." |
            Add-Content -Path $env:GITHUB_STEP_SUMMARY
          if (-not $manifestVerified -or -not $candidateBindingValid -or
              ($env:SMOKE_RESULT -eq 'success' -and -not $stagingValidated)) {
            throw 'Candidate evidence is incomplete or inconsistent; no validation or promotion is authorized.'
          }
          "Staging: result=$($attempt.result); transaction_scope=$($attempt.transaction_scope); postdeploy_result=$($attempt.postdeploy_result); failure_state_verification=$($attempt.failure_state_verification). No rollback is inferred from an exit code." |
            Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Preserve Staging deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-deployment-attempt
          path: |
            ${{ runner.temp }}/staging-deployment-evidence/
            ${{ runner.temp }}/staging-release/dacpac/staging-*-report.xml
            ${{ runner.temp }}/staging-release/dacpac/staging-*-script.sql
          if-no-files-found: error
          retention-days: 30
