name: Validate AuthCraft staging packages (no deployment)

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      verify_staging_publisher:
        description: Verify staging OIDC/SQL review permissions only (no deployment)
        type: boolean
        required: false
        default: false
      evaluate_staging_schema:
        description: Generate Staging DacFx report/script, including publisher verification (no Publish)
        type: boolean
        required: false
        default: false
      last_successful_staging_commit_sha:
        description: SHA of the last verified Staging deployment; required unless bootstrap is explicitly selected
        type: string
        required: false
        default: ''
      recovery_deployment_run_id:
        description: Failed partial Staging deployment run to record as recovery evidence only; never authorizes Publish
        type: string
        required: false
        default: ''
      allow_initial_staging_bootstrap:
        description: Record an unknown baseline only when Actions has no successful Staging deployment
        type: boolean
        required: false
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: authcraft-staging-validation
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build API
        run: dotnet build authcraft-api/authcraft-api.csproj --configuration Release

      - name: Run focused environment and pipeline tests
        shell: pwsh
        run: |
          $windowsPowerShellModules = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\Modules'
          $env:PSModulePath = "$windowsPowerShellModules;$env:PSModulePath"
          & powershell.exe -NoProfile -NonInteractive -Command "Get-Command Get-FileHash -ErrorAction Stop | Out-Null"
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell hashing module is unavailable.' }
          dotnet test authcraft-api.Tests/authcraft-api.Tests.csproj --configuration Release --filter "FullyQualifiedName~Environment|FullyQualifiedName~DeploymentPipelineTests|FullyQualifiedName~StagingReleaseSmokeTests|FullyQualifiedName~DeploymentRecoveryTests|FullyQualifiedName~DatabaseDeploymentReviewTests|FullyQualifiedName~ProductionApprovalTests|FullyQualifiedName~StagingPublisherVerificationTests"
          if ($LASTEXITCODE -ne 0) { throw 'Focused environment and pipeline tests failed.' }

      - name: Build SQL project and DACPAC
        run: msbuild authcraft-db/authcraft-db.sqlproj /p:Configuration=Release

      - name: Package release artifacts
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDirectory = Join-Path $env:RUNNER_TEMP 'authcraft-release'
          $publishDirectory = Join-Path $releaseDirectory 'api-publish'
          New-Item -ItemType Directory -Path $releaseDirectory -Force | Out-Null

          dotnet publish authcraft-api/authcraft-api.csproj --configuration Release --no-build --output $publishDirectory
          if ($LASTEXITCODE -ne 0) { throw 'API publish failed.' }

          $apiArtifactPath = Join-Path $releaseDirectory 'api.zip'
          Compress-Archive -Path (Join-Path $publishDirectory '*') -DestinationPath $apiArtifactPath
          if (-not (Test-Path -LiteralPath $apiArtifactPath -PathType Leaf)) { throw 'API package creation failed.' }

          $dacpacPath = (Resolve-Path 'authcraft-db/bin/Release/authcraft-db.dacpac').Path
          $manifestPath = Join-Path $releaseDirectory 'release-manifest.json'
          ./scripts/New-ReleaseManifest.ps1 `
            -ApiArtifactPath $apiArtifactPath `
            -DatabaseArtifactPath $dacpacPath `
            -CommitSha $env:GITHUB_SHA `
            -RunId $env:GITHUB_RUN_ID `
            -OutputPath $manifestPath
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) { throw 'Release manifest creation failed.' }

          "Release packages created for commit $env:GITHUB_SHA. This workflow does not deploy to Azure." |
            Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Record built candidate
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDirectory = Join-Path $env:RUNNER_TEMP 'authcraft-release'
          $manifest = Get-Content -LiteralPath (Join-Path $releaseDirectory 'release-manifest.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($manifest.commit_sha -cne $env:GITHUB_SHA -or
              [string]$manifest.run_id -cne $env:GITHUB_RUN_ID -or
              $manifest.api.artifact -cne 'api' -or $manifest.database.artifact -cne 'dacpac' -or
              $manifest.api.sha256 -cnotmatch '^[a-f0-9]{64}$' -or
              $manifest.database.sha256 -cnotmatch '^[a-f0-9]{64}$') {
            throw 'The built candidate manifest does not match this packaging run.'
          }
          $candidate = [ordered]@{
            commit_sha = $manifest.commit_sha
            run_id = [string]$manifest.run_id
            created_at = [DateTimeOffset]::UtcNow.ToString('o')
            api_artifact_name = $manifest.api.artifact
            api_sha256 = $manifest.api.sha256
            dacpac_artifact_name = $manifest.database.artifact
            dacpac_sha256 = $manifest.database.sha256
            state = 'built'
            staging_validation_state = 'not_validated'
            staging_validation_reference = $null
            promotion_authorized = $false
          }
          $candidate | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $releaseDirectory 'candidate-release.json') -Encoding UTF8
          "Candidate commit=$($candidate.commit_sha); run=$($candidate.run_id); state=built; staging_validation=not_validated; promotion_authorized=false. No deployment was performed." |
            Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload API package
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: api
          path: ${{ runner.temp }}/authcraft-release/api.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload database package
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dacpac
          path: authcraft-db/bin/Release/authcraft-db.dacpac
          if-no-files-found: error
          retention-days: 30

      - name: Upload release manifest
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: ${{ runner.temp }}/authcraft-release/release-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload built candidate record
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: candidate-release
          path: ${{ runner.temp }}/authcraft-release/candidate-release.json
          if-no-files-found: error
          retention-days: 30

  verify-staging-publisher:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.verify_staging_publisher == true || inputs.evaluate_staging_schema == true)
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Build SQL verification tests
        run: dotnet build authcraft-api.Tests/authcraft-api.Tests.csproj --configuration Release

      - name: Download this run's DACPAC for read-only evaluation
        if: inputs.evaluate_staging_schema == true
        uses: actions/download-artifact@v4
        with:
          name: dacpac
          path: ${{ runner.temp }}/staging-schema-review

      - name: Download this run's release manifest
        if: inputs.evaluate_staging_schema == true
        uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: ${{ runner.temp }}/staging-schema-review

      - name: Login as staging publisher via OIDC
        uses: azure/login@v2
        with:
          client-id: a2382f63-d653-47f3-82ca-9f2696f63f0a
          tenant-id: b7bd0c07-88dc-4c47-81ba-608fd7607a82
          subscription-id: 948a8f49-fd90-40d9-8fa9-12f722768a7a

      - name: Verify staging SQL login and review-only permissions
        shell: pwsh
        env:
          EVALUATE_STAGING_SCHEMA: ${{ inputs.evaluate_staging_schema }}
          AUTHCRAFT_SQL_DIAGNOSTIC_PUBLIC_KEY: ${{ vars.AUTHCRAFT_SQL_DIAGNOSTIC_PUBLIC_KEY }}
          AUTHCRAFT_SQL_DIAGNOSTIC_PATH: ${{ runner.temp }}/staging-sql-diagnostic.encrypted.json
        run: |
          $parameters = @{}
          if ($env:EVALUATE_STAGING_SCHEMA -eq 'true') {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.SQL.SSDT -property installationPath
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($installation)) {
              throw 'Visual Studio installation could not be resolved.'
            }
            $sqlPackage = Join-Path $installation 'Common7\IDE\Extensions\Microsoft\SQLDB\DAC\SqlPackage.exe'
            if (-not (Test-Path -LiteralPath $sqlPackage -PathType Leaf)) {
              throw 'SqlPackage is unavailable; no schema evaluation authorized.'
            }
            $evidenceDirectory = Join-Path $env:RUNNER_TEMP 'staging-schema-review'
            $sqlPackageVersion = & $sqlPackage /Version
            if ($LASTEXITCODE -ne 0 -or ($sqlPackageVersion -join "`n").Trim() -notmatch '^\d+\.\d+\.\d+\.\d+$') {
              throw 'The evaluation SqlPackage version could not be verified.'
            }
            [ordered]@{
              commit_sha = $env:GITHUB_SHA
              run_id = $env:GITHUB_RUN_ID
              sqlpackage_version = ($sqlPackageVersion -join "`n").Trim()
              sqlpackage_sha256 = (Get-FileHash -LiteralPath $sqlPackage -Algorithm SHA256).Hash.ToLowerInvariant()
              include_transactional_scripts = $true
              script_database_options = $false
            } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidenceDirectory 'evaluation-toolchain.json') -Encoding UTF8
            $parameters = @{
              EvaluateSchema = $true
              DacpacPath = Join-Path $evidenceDirectory 'authcraft-db.dacpac'
              ManifestPath = Join-Path $evidenceDirectory 'release-manifest.json'
              SqlPackagePath = $sqlPackage
            }
          }
          & .\scripts\Test-StagingPublisher.ps1 @parameters
          if ($LASTEXITCODE -ne 0) { throw 'Staging publisher verification failed.' }
          'Staging SQL review identity verified. No deployment authorized or attempted.' |
            Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Retain read-only schema evaluation evidence
        if: success() && inputs.evaluate_staging_schema == true
        uses: actions/upload-artifact@v4
        with:
          name: staging-schema-review
          path: |
            ${{ runner.temp }}/staging-schema-review/staging-evaluation-*-report.xml
            ${{ runner.temp }}/staging-schema-review/staging-evaluation-*-script.sql
            ${{ runner.temp }}/staging-schema-review/evaluation-toolchain.json
          if-no-files-found: error
          retention-days: 30

      - name: Retain opt-in encrypted SQL failure diagnostic
        if: failure() && inputs.evaluate_staging_schema == true && vars.AUTHCRAFT_SQL_DIAGNOSTIC_PUBLIC_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: staging-sql-diagnostic-encrypted
          path: ${{ runner.temp }}/staging-sql-diagnostic.encrypted.json
          if-no-files-found: error
          retention-days: 1

  preflight-staging:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.evaluate_staging_schema == true
    needs:
      - validate
      - verify-staging-publisher
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download this run's release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: api
          path: ${{ runner.temp }}/staging-preflight
      - uses: actions/download-artifact@v4
        with:
          name: dacpac
          path: ${{ runner.temp }}/staging-preflight/dacpac
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: ${{ runner.temp }}/staging-preflight/manifest

      - name: Login as staging publisher via OIDC for scoped metadata reads
        uses: azure/login@v2
        with:
          client-id: a2382f63-d653-47f3-82ca-9f2696f63f0a
          tenant-id: b7bd0c07-88dc-4c47-81ba-608fd7607a82
          subscription-id: 948a8f49-fd90-40d9-8fa9-12f722768a7a

      - name: Verify release provenance and live Staging gates
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          LAST_SUCCESSFUL_STAGING_COMMIT_SHA: ${{ inputs.last_successful_staging_commit_sha }}
          RECOVERY_DEPLOYMENT_RUN_ID: ${{ inputs.recovery_deployment_run_id }}
          ALLOW_INITIAL_STAGING_BOOTSTRAP: ${{ inputs.allow_initial_staging_bootstrap }}
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactDirectory = Join-Path $env:RUNNER_TEMP 'staging-preflight'
          $parameters = @{
            ManifestPath = Join-Path $artifactDirectory 'manifest\release-manifest.json'
            ApiArtifactPath = Join-Path $artifactDirectory 'api\api.zip'
            DatabaseArtifactPath = Join-Path $artifactDirectory 'dacpac\authcraft-db.dacpac'
            ExpectedCommitSha = $env:GITHUB_SHA
            ExpectedRunId = $env:GITHUB_RUN_ID
            GitHubRef = $env:GITHUB_REF
            TargetEnvironment = 'staging'
          }
          if (-not [string]::IsNullOrWhiteSpace($env:RECOVERY_DEPLOYMENT_RUN_ID)) {
            if (-not [string]::IsNullOrWhiteSpace($env:LAST_SUCCESSFUL_STAGING_COMMIT_SHA) -or
                $env:ALLOW_INITIAL_STAGING_BOOTSTRAP -eq 'true') {
              throw 'Partial Staging recovery evidence cannot be combined with a known baseline or bootstrap.'
            }
            $parameters.LastSuccessfulCommitSha = 'unknown'
            $parameters.RecoveryDeploymentRunId = $env:RECOVERY_DEPLOYMENT_RUN_ID
          } elseif ($env:ALLOW_INITIAL_STAGING_BOOTSTRAP -eq 'true') {
            if (-not [string]::IsNullOrWhiteSpace($env:LAST_SUCCESSFUL_STAGING_COMMIT_SHA) -and
                $env:LAST_SUCCESSFUL_STAGING_COMMIT_SHA -cne 'unknown') {
              throw 'Initial bootstrap cannot also specify a known previous commit.'
            }
            $parameters.LastSuccessfulCommitSha = 'unknown'
            $parameters.AllowInitialStagingBootstrap = $true
          } else {
            $parameters.LastSuccessfulCommitSha = $env:LAST_SUCCESSFUL_STAGING_COMMIT_SHA
          }
          $preflightOutput = & .\scripts\Test-ReleasePreflight.ps1 @parameters
          if ($LASTEXITCODE -ne 0) { throw 'Staging preflight failed; no deployment was attempted.' }
          $preflight = ($preflightOutput -join "`n") | ConvertFrom-Json
          $expectedPreflightState = if ([string]::IsNullOrWhiteSpace($env:RECOVERY_DEPLOYMENT_RUN_ID)) {
            'ready_for_review'
          } else {
            'recovery_review_required'
          }
          if ($preflight.state -cne $expectedPreflightState -or
              $preflight.target -cne 'staging' -or
              $preflight.deployment_authorized -ne $false) {
            throw 'Staging preflight did not return the expected review-only state.'
          }
          if ($expectedPreflightState -eq 'recovery_review_required' -and
              ($preflight.baseline_state -cne 'partial_recovery' -or
                  $preflight.live_state_reconciliation_required -ne $true -or
                  $preflight.bootstrap_review_required -ne $false)) {
            throw 'Partial recovery evidence did not remain explicitly non-authorizing.'
          }
          $preflightOutput | Add-Content -Path $env:GITHUB_STEP_SUMMARY
